apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: KUMA_URL
              value: {{ required "kuma.url is required" .Values.kuma.url | quote }}
            - name: KUMA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "kuma.existingSecret is required" .Values.kuma.existingSecret }}
                  key: username
            - name: KUMA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "kuma.existingSecret is required" .Values.kuma.existingSecret }}
                  key: password
            - name: WATCH_ALL
              value: {{ .Values.watchAll | quote }}
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: OPT_IN_BY_DEFAULT
              value: {{ .Values.optInByDefault | quote }}
            - name: DRIFT_CHECK_INTERVAL
              value: {{ .Values.driftCheckInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: DEFAULT_TAGS
              value: {{ join "," .Values.defaultTags | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
