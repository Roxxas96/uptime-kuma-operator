apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-kuma-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uptime-kuma-operator.labels" . | nindent 4 }}
spec:
  # No leader election: a rolling update could otherwise run two replicas
  # reconciling concurrently against Kuma for a moment. Recreate guarantees
  # the old pod is gone before the new one starts.
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "uptime-kuma-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime-kuma-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "uptime-kuma-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KUMA_URL
              value: {{ required "kuma.url is required" .Values.kuma.url | quote }}
            - name: KUMA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "kuma.existingSecret is required" .Values.kuma.existingSecret }}
                  key: username
            - name: KUMA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "kuma.existingSecret is required" .Values.kuma.existingSecret }}
                  key: password
            - name: WATCH_ALL
              value: {{ .Values.watchAll | quote }}
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: OPT_IN_BY_DEFAULT
              value: {{ .Values.optInByDefault | quote }}
            - name: DRIFT_CHECK_INTERVAL
              value: {{ .Values.driftCheckInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: DEFAULT_TAGS
              value: {{ join "," .Values.defaultTags | quote }}
            - name: LABEL_TAG_PATTERNS
              value: {{ join "," .Values.labelTagPatterns | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
