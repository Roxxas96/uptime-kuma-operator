{{- /*
  Security note: the "secrets" get rule below is intentionally broad — it
  grants read access to any Secret (by name) in every watched namespace
  (or cluster-wide under watchAll), because the operator resolves
  HTTP-auth/Gamedig-token Secrets referenced by arbitrary Monitor/Ingress/
  HTTPRoute resources whose names aren't known ahead of time, so RBAC
  resourceNames can't scope this down generically. Secrets are never
  listed or cached (see cmd/main.go), only fetched one-by-one by name, but
  anyone who can create/edit a watched Ingress, HTTPRoute, or Monitor in
  scope can make the operator read any Secret in that scope. Treat this
  ServiceAccount's access as equivalent to Secret-read access across
  whatever namespaces (or the whole cluster) it watches.
*/ -}}
{{- $rules := list
  (dict "apiGroups" (list "networking.k8s.io") "resources" (list "ingresses") "verbs" (list "get" "list" "watch" "update" "patch"))
  (dict "apiGroups" (list "gateway.networking.k8s.io") "resources" (list "httproutes") "verbs" (list "get" "list" "watch" "update" "patch"))
  (dict "apiGroups" (list "uptime-kuma.io") "resources" (list "monitors") "verbs" (list "get" "list" "watch" "update" "patch"))
  (dict "apiGroups" (list "uptime-kuma.io") "resources" (list "monitors/status") "verbs" (list "get" "update" "patch"))
  (dict "apiGroups" (list "uptime-kuma.io") "resources" (list "monitors/finalizers") "verbs" (list "update"))
  (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
  (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "get"))
-}}
{{- if .Values.watchAll }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uptime-kuma-operator.fullname" . }}
  labels:
    {{- include "uptime-kuma-operator.labels" . | nindent 4 }}
rules:
{{ toYaml $rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uptime-kuma-operator.fullname" . }}
  labels:
    {{- include "uptime-kuma-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uptime-kuma-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptime-kuma-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- /*
  config.Load falls back to POD_NAMESPACE (the release namespace, injected by
  deployment.yaml) when WATCH_NAMESPACES is empty, so the RBAC scope has to
  fall back the same way — otherwise the chart's own defaults render no Role
  at all and the manager 403s on every list/watch.
*/}}
{{- range (default (list .Release.Namespace) .Values.watchNamespaces) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "uptime-kuma-operator.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "uptime-kuma-operator.labels" $ | nindent 4 }}
rules:
{{ toYaml $rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "uptime-kuma-operator.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "uptime-kuma-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "uptime-kuma-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptime-kuma-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
