---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: monitors.uptime-kuma.io
spec:
  group: uptime-kuma.io
  names:
    kind: Monitor
    listKind: MonitorList
    plural: monitors
    singular: monitor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.monitorID
      name: MonitorID
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              The first five rules require the sub-struct matching spec.type; the second
              five reject every other sub-struct, so the discriminator is exclusive rather
              than silently ignoring extra configuration.
            properties:
              description:
                description: Description is shown alongside the monitor in the Kuma
                  UI.
                type: string
              dns:
                properties:
                  domainExpiryNotification:
                    description: DomainExpiryNotification enables domain expiry notifications.
                    type: boolean
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                  resolveType:
                    type: string
                  resolverServer:
                    type: string
                required:
                - host
                type: object
              gamedig:
                properties:
                  domainExpiryNotification:
                    description: DomainExpiryNotification enables domain expiry notifications.
                    type: boolean
                  game:
                    type: string
                  givenPortOnly:
                    description: |-
                      GivenPortOnly, when true, probes only the given port instead of
                      letting Kuma guess it. false (default) matches Kuma's "Guess Port"
                      checked in its UI.
                    type: boolean
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                required:
                - game
                - host
                - port
                type: object
              group:
                description: |-
                  Group is the name of an existing parent group monitor. Must already
                  exist in Kuma — an unresolvable name fails the reconcile.
                type: string
              http:
                properties:
                  acceptedStatusCodes:
                    items:
                      type: string
                    type: array
                  body:
                    description: Body is an opaque, unvalidated passthrough to Kuma.
                    type: string
                  cacheBust:
                    description: CacheBust appends a cache-busting query parameter
                      to the request URL.
                    type: boolean
                  domainExpiryNotification:
                    description: DomainExpiryNotification enables domain expiry notifications.
                    type: boolean
                  expiryNotification:
                    description: ExpiryNotification enables TLS certificate expiry
                      notifications.
                    type: boolean
                  headers:
                    description: Headers is an opaque, unvalidated passthrough to
                      Kuma.
                    type: string
                  ignoreTLS:
                    description: IgnoreTLS skips TLS certificate validation.
                    type: boolean
                  maxRedirects:
                    description: MaxRedirects caps how many redirects the check follows.
                    format: int32
                    type: integer
                  method:
                    type: string
                  timeout:
                    description: Timeout is the request timeout in seconds.
                    format: int64
                    type: integer
                  url:
                    type: string
                required:
                - url
                type: object
              interval:
                format: int64
                type: integer
              name:
                type: string
              notifications:
                description: |-
                  Notifications lists notification channel names to alert on this
                  monitor. Each must already exist in Kuma — an unresolvable name
                  fails the reconcile.
                items:
                  type: string
                type: array
              ping:
                properties:
                  domainExpiryNotification:
                    description: DomainExpiryNotification enables domain expiry notifications.
                    type: boolean
                  host:
                    type: string
                  packetSize:
                    description: PacketSize is the ICMP packet size in bytes.
                    format: int32
                    type: integer
                  timeout:
                    description: Timeout is the per-ping timeout in seconds.
                    format: int64
                    type: integer
                required:
                - host
                type: object
              proxy:
                description: |-
                  Proxy is the numeric ID of an existing Kuma proxy to route checks
                  through. Kuma proxies have no name field, so this is ID-based.
                format: int64
                type: integer
              resendInterval:
                description: |-
                  ResendInterval is how many consecutive failed checks pass between
                  repeated down notifications. 0 disables resending.
                format: int64
                type: integer
              retries:
                format: int64
                type: integer
              retryInterval:
                format: int64
                type: integer
              tcp:
                properties:
                  domainExpiryNotification:
                    description: DomainExpiryNotification enables domain expiry notifications.
                    type: boolean
                  expectedSSLAlert:
                    description: |-
                      ExpectedSSLAlert is the TLS alert name expected during the handshake
                      (e.g. for mTLS verification).
                    type: string
                  expiryNotification:
                    description: |-
                      ExpiryNotification enables TLS certificate expiry notifications. Only
                      honoured by Kuma when TLSMode is "secure" or "starttls".
                    type: boolean
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                  tlsMode:
                    description: |-
                      TLSMode selects the TLS handshake mode: "" (plain TCP), "nostarttls",
                      "secure", or "starttls".
                    enum:
                    - ""
                    - nostarttls
                    - secure
                    - starttls
                    type: string
                required:
                - host
                - port
                type: object
              type:
                enum:
                - HTTP
                - TCP
                - Ping
                - DNS
                - Gamedig
                type: string
              upsideDown:
                description: |-
                  UpsideDown inverts up/down: the monitor reports "up" when the
                  underlying check fails and "down" when it succeeds.
                type: boolean
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.http is required when type is HTTP
              rule: self.type != 'HTTP' || has(self.http)
            - message: spec.tcp is required when type is TCP
              rule: self.type != 'TCP' || has(self.tcp)
            - message: spec.ping is required when type is Ping
              rule: self.type != 'Ping' || has(self.ping)
            - message: spec.dns is required when type is DNS
              rule: self.type != 'DNS' || has(self.dns)
            - message: spec.gamedig is required when type is Gamedig
              rule: self.type != 'Gamedig' || has(self.gamedig)
            - message: spec.http must not be set unless type is HTTP
              rule: self.type == 'HTTP' || !has(self.http)
            - message: spec.tcp must not be set unless type is TCP
              rule: self.type == 'TCP' || !has(self.tcp)
            - message: spec.ping must not be set unless type is Ping
              rule: self.type == 'Ping' || !has(self.ping)
            - message: spec.dns must not be set unless type is DNS
              rule: self.type == 'DNS' || !has(self.dns)
            - message: spec.gamedig must not be set unless type is Gamedig
              rule: self.type == 'Gamedig' || !has(self.gamedig)
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              monitorID:
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation last successfully
                  synced to Kuma. The reconciler skips the Kuma round-trip when it
                  already matches .metadata.generation — kuma.Client.Upsert (editMonitor)
                  restarts the monitor's check timer even on an unchanged payload, so
                  calling it on every reconcile (including ones triggered by something
                  other than a spec change) would prevent the monitor from ever
                  completing more than one check cycle.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
