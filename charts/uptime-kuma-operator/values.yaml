image:
  repository: uptime-kuma-operator
  tag: latest

# Names of existing Secrets (docker-registry type) to pull the operator
# image from a private registry. e.g. [{name: my-registry-secret}]
imagePullSecrets: []

kuma:
  url: ""
  existingSecret: "" # must contain keys "username" and "password"

watchAll: false
watchNamespaces: [] # e.g. ["prod", "staging"]; ignored (cluster-wide RBAC used) if watchAll is true

# Independent of watchAll: whether Ingress/HTTPRoute resources need an
# explicit uptime-kuma.io/enabled=true annotation to be synced. false (the
# default) requires it everywhere, including when watchAll is true — set
# this to true to sync everything unless annotated enabled=false instead.
optInByDefault: false

# How often a reconciler that found nothing to sync re-checks that Kuma
# still has the monitor(s) it's supposed to, recreating any deleted
# out-of-band (e.g. manually in the Kuma UI). Go duration string.
driftCheckInterval: 30s

# One of "debug", "info" (default), "warn", "error". "debug" adds
# per-reconcile detail (what triggered a reconcile, which decision branch
# was taken) on top of the always-on create/update/delete action logs.
logLevel: info

# Tag names applied to every monitor the operator manages, in addition to
# whatever tags that monitor's own resource specifies (annotation or
# Monitor CRD spec.tags). Empty by default. e.g. ["k8s", "managed"]
defaultTags: []

# labelTagPatterns lists regex patterns (see internal/config.Config's
# LabelTagPatterns doc comment for exact matching semantics — each pattern
# is anchored, so "team-.*" is a prefix filter). A label on a managed
# Ingress/HTTPRoute/Monitor is imported as a "key=value" Kuma tag when its
# key fully matches at least one pattern. Empty by default — label-tag
# inference is entirely off until at least one pattern is configured. A
# pattern must not contain a literal comma (patterns are comma-joined with
# no escaping, same as defaultTags). e.g. ["team", "env-.*"]
labelTagPatterns: []
