name: CI

on:
  push:
    branches: [main]
    tags: [v*.*.*, v*.*.*-rc*]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Reuses .pre-commit-config.yaml as the single source of truth for lint/format
  # checks — same checks that run locally via `pre-commit install` /
  # `make pre-commit-all`, so there's exactly one place these rules live.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # installs go, golangci-lint, govulncheck, helm, pre-commit pinned in mise.toml
      - uses: pre-commit/action@v3.0.1

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: make test
      # make test's `manifests` prerequisite regenerates config/crd/bases/ from
      # the Go types and copies it into the chart's crds/ — fail if either is
      # stale (a hand-edited or out-of-sync CRD would otherwise ship silently).
      - name: Verify generated CRDs are up to date
        run: git diff --exit-code -- config/crd/bases charts/uptime-kuma-operator/crds

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      # Upload the Trivy SARIF scan results to the Security tab.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker. Tag rules are explicit
      # (rather than the action's defaults) so a version tag produces an
      # unprefixed image tag (0.1.0, not v0.1.0) — matching Helm's own
      # unprefixed chart-version convention, since the chart's image.tag
      # falls back to .Chart.AppVersion.
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Scan the pushed image for OS and Go-binary vulnerabilities —
      # govulncheck (pre-commit) only covers the Go module graph, not the
      # distroless base image's OS packages. image-ref reuses meta's tags
      # output (already correctly lowercased) rather than reconstructing
      # the ref by hand.
      # https://github.com/aquasecurity/trivy-action
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy scan results to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif

  release:
    runs-on: ubuntu-latest
    # Not bump: bump never runs on a tag push (see its own if), and release
    # already resolves its own app-version from the tag when packaging.
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v4 # installs helm, pinned in mise.toml

      # The chart's own `version:` is the source of truth for what gets
      # published — it's bumped deliberately in the PR that changes the
      # chart, not derived from the tag. This just catches the mismatch
      # (forgot to bump, or tagged the wrong ref) before publishing.
      - name: Verify chart version matches the tag
        run: |
          CHART_VERSION=$(grep '^version:' charts/uptime-kuma-operator/Chart.yaml | awk '{print $2}')
          if [ "v${CHART_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::charts/uptime-kuma-operator/Chart.yaml version (${CHART_VERSION}) doesn't match tag (${GITHUB_REF_NAME}) — bump Chart.yaml's version before tagging a release."
            exit 1
          fi

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/uptime-kuma-operator --app-version "${GITHUB_REF_NAME#v}" -d dist

      - name: Log into registry ${{ env.REGISTRY }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # ghcr.io (like Docker) rejects uppercase repository path segments;
      # github.repository preserves the owner's actual case.
      - name: Push chart to ${{ env.REGISTRY }}
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          helm push dist/*.tgz "oci://${{ env.REGISTRY }}/${REPO_LOWER}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: dist/*.tgz
